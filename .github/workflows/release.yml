name: Release

# Cut a release by pushing a tag like v0.1.0. electron-builder builds Windows
# and macOS installers and publishes them to a GitHub Release — which is the
# feed electron-updater reads, so users auto-update from here.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false   # one platform failing shouldn't cancel the other
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          - os: macos-latest
            build: npm run dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # To code-sign macOS later, add the signing secrets in the repo and
        # reintroduce them here (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
        # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID). Passing them EMPTY breaks
        # the build — electron-builder treats an empty CSC_LINK as a cert path.
        run: ${{ matrix.build }} -- --publish always
